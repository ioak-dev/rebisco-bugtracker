name: csharp CI

on:
  push:
    branches: [ csharp ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore csharp

      - name: Test with coverage
        run: dotnet test csharp --collect:"XPlat Code Coverage"


