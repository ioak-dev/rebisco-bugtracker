name: csharp CI

on:
  push:
    branches: [ csharp ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore csharp/rebisco-bugtracker.Api/rebisco-bugtracker.Api.sln
        
      - name: Build
        run: dotnet build csharp/rebisco-bugtracker.Api/rebisco-bugtracker.Api.sln --no-restore

      - name: Test with coverage
        run: dotnet test csharp/rebisco-bugtracker.Api/rebisco-bugtracker.Api.sln --no-build --collect:"XPlat Code Coverage"


